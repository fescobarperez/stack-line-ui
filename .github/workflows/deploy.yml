# Despliegue a producción — SOLO manual.
#
# Espejo del flujo de stack-line-services. Existe para poder publicar desde
# el repositorio que estás tocando: el servidor hace pull de AMBOS repos y
# reconstruye lo que cambió, así que da igual desde cuál se lance.
#
# Si editas este archivo, actualiza también el del otro repositorio.

name: Deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Qué reconstruir"
        type: choice
        required: true
        default: auto
        options: [auto, backend, web, all]

# Comparte grupo con el flujo del otro repositorio: dos despliegues a la vez
# sobre el mismo servidor se pisan, vengan de donde vengan.
concurrency:
  group: deploy-produccion
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: produccion
    timeout-minutes: 25

    steps:
      - name: Preparar la clave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Desplegar
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o BatchMode=yes \
              "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
              "~/stackline/stack-line-services/deploy/deploy.sh ${{ inputs.target }}"

      - name: Limpiar
        if: always()
        run: rm -f ~/.ssh/deploy_key
