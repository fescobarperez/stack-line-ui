# Manual production deployment for the web application only.
# The backend repository owns the shared Docker Compose stack and deploy script;
# the server runs one deployment at a time (deploy.sh takes a lock), so this
# job may wait for another repository's deployment to finish.

name: Deploy

on:
  workflow_dispatch:

concurrency:
  group: deploy-produccion
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: produccion
    timeout-minutes: 45

    steps:
      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o BatchMode=yes \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=10 \
              "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
              "git -C ~/stackline/stack-line-services fetch -q origin main && git -C ~/stackline/stack-line-services show origin/main:deploy/deploy.sh | bash -s -- web"

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
